# Configuration for GitHub's auto-generated release notes.
# Used by helm/chart-releaser (CR_GENERATE_RELEASE_NOTES=true), which calls
# the generate-notes API with `previous_tag_name` set to the previous tag of
# the SAME chart. The resulting delta therefore only contains the PRs merged
# since that chart's previous release -- i.e. only PRs related to the chart
# (same behavior as prometheus-community/helm-charts).
# See https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - release-note-none
  categories:
    - title: '🚀 Features'
      labels:
        - 'feature'
        - 'enhancement'
        - 'kind/feature'
        - 'kind/enhancement'
    - title: '🐛 Bug Fixes'
      labels:
        - 'kind/bug'
        - 'fix'
        - 'bugfix'
        - 'bug'
    - title: '📝 Documentation'
      labels:
        - 'kind/documentation'
    - title: '🧰 Maintenance'
      labels:
        - 'chore'
        - 'dependencies'
    - title: 'Other Changes'
      labels:
        - '*'
